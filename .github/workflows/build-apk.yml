name: Build APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar el APK como pre-release (descarga directa desde el móvil)
        type: boolean
        default: false

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      signing: ${{ steps.signing.outputs.kind }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        # Same flet / flet-cli versions as uv.lock.
        run: |
          pip install $(python -c 'import tomllib; pk = {p["name"]: p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"]}; print("flet==" + pk["flet"], "flet-cli==" + pk["flet-cli"])')

      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.DIEZAPP_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DIEZAPP_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ]; then
              echo "::error::Falta el secret DIEZAPP_KEYSTORE_PASSWORD" >&2
              exit 1
            fi
            # The secret may carry line breaks or \r if pasted from the clipboard.
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/diezapp-release.jks"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            # pyproject.toml points at the keystore on the dev machine, which
            # does not exist here; drop it so Flutter signs with a debug key.
            python -c 'import pathlib, re; p = pathlib.Path("pyproject.toml"); p.write_text(re.sub(r"(?ms)^\[tool\.flet\.android\.signing\]\n.*?(?=^\[|\Z)", "", p.read_text()))'
            echo "kind=debug" >> "$GITHUB_OUTPUT"
            echo "::warning title=APK con firma de depuración::No hay secret DIEZAPP_KEYSTORE_B64. Este APK no se instala encima de la app firmada con diezapp-release.jks: hay que desinstalarla antes (y se pierden los datos locales)."
          fi

      - name: Build APK
        env:
          SIGNING: ${{ steps.signing.outputs.kind }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.DIEZAPP_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.DIEZAPP_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DIEZAPP_KEY_ALIAS }}
        run: |
          args=()
          if [ "$SIGNING" = release ]; then
            # CLI flags win over pyproject.toml. Without DIEZAPP_KEY_ALIAS the
            # alias comes from there (diezapp-key).
            args+=(--android-signing-key-store "$RUNNER_TEMP/diezapp-release.jks")
            if [ -n "$KEY_ALIAS" ]; then
              args+=(--android-signing-key-alias "$KEY_ALIAS")
            fi
          fi
          flet build apk --yes -v "${args[@]}"

      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/diezapp-release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: diezapp-apk-${{ github.run_number }}
          path: build/apk/*.apk
          if-no-files-found: error

  publish-apk:
    if: ${{ inputs.publish }}
    needs: build-apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: diezapp-apk-${{ github.run_number }}
          path: apk

      - name: Publish APK as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING: ${{ needs.build-apk.outputs.signing }}
        run: |
          gh release create "apk-${{ github.run_number }}" apk/*.apk \
            --repo "${{ github.repository }}" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "DiezApp APK #${{ github.run_number }}" \
            --notes "Build de prueba desde ${{ github.ref_name }} (${{ github.sha }}), firma: $SIGNING"
