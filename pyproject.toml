[project]
name = "DiezApp"
version = "0.2.0"
description = "Add to calculate the total of a bill"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flet>=0.86.5",
    "fpdf2>=2.8.3",
    "httpx>=0.28.0",
]

[tool.flet.app]
path = "src"

[tool.flet.app.startup_screen]
show = true
message = "Cargando..."

[tool.flet.android]
# Build only the ARM64 Android variant to keep the APK smaller on modern phones.
target_arch = ["arm64-v8a"]

# Google Drive OAuth redirect (see src/utils/gdrive_auth.py). `scheme` MUST be
# the reversed-domain form of the Android OAuth Client ID created in Google
# Cloud Console. The public Android Client ID is configured in
# src/utils/gdrive_auth.py. `host` must stay "oauth2redirect"
# to match REDIRECT_HOST in gdrive_auth.py.
[tool.flet.android.deep_linking]
scheme = "com.googleusercontent.apps.105025843954-9p82u5mujmfakqmt4t52bt8pb9ntak4o"
host = "oauth2redirect"

[tool.flet.ios.deep_linking]
scheme = "com.googleusercontent.apps.REPLACE_WITH_IOS_CLIENT_ID"
host = "oauth2redirect"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.flet]
org = "com.diezapp"      # usa tu dominio real o algo único, ej: "com.kevindev"
product = "DiezApp"

[tool.flet.android.signing]
key_store = "/mnt/c/dev/diezmapp/diezapp-release.jks"
key_alias = "diezapp-key"