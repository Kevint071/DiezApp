[project]
name = "DiezApp"
version = "0.3.0"
description = "Add to calculate the total of a bill"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flet>=1.0.4",
    "flet-note-editor",
    "fpdf2>=2.8.3",
    "httpx>=0.28.0",
    "truststore>=0.10.4",
]

[tool.flet.app]
path = "src"

# Rich text note editor (Flutter extension). Flet only compiles extensions in
# `flet debug` / `flet build`; plain `flet run` can't show the note editor.
[tool.flet.dev_packages]
flet-note-editor = "packages/flet-note-editor"

[tool.uv.sources]
flet-note-editor = { path = "packages/flet-note-editor", editable = true }

[tool.flet.boot_screen.flet]
spinner_size = 30
startup_message = "Cargando..."

[tool.flet.android]
# Build only the ARM64 Android variant to keep the APK smaller on modern phones.
target_arch = ["arm64-v8a"]

# Google Drive OAuth redirect (see src/diezapp/infrastructure/google). Google no
# longer accepts a custom-scheme redirect_uri directly, so the diezmapp-api
# backend proxies the flow and redirects back here via this app-owned
# scheme/host. `host` must stay "oauth2redirect" to match BACKEND's
# APP_REDIRECT_HOST env var; `scheme` must match its APP_REDIRECT_SCHEME.
[tool.flet.android.deep_linking]
scheme = "com.diezapp.diezapp"
host = "oauth2redirect"

[tool.flet.ios.deep_linking]
scheme = "com.diezapp.diezapp"
host = "oauth2redirect"

[dependency-groups]
dev = [
    "flet-cli>=1.0.4",
    "flet-desktop>=1.0.4",
    "flet-web>=1.0.4",
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["diezapp"]

[tool.flet]
org = "com.diezapp"      # usa tu dominio real o algo único, ej: "com.kevindev"
product = "DiezApp"

[tool.flet.android.signing]
key_store = "/mnt/c/dev/diezmap-code/diezmapp/diezapp-release.jks"
key_alias = "diezapp-key"
